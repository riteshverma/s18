name: Docker CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install pytest

      - name: Run fast contract + settings tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_settings_loader.py \
            tests/integrations/test_contracts.py \
            tests/integrations/test_registry.py \
            tests/integrations/test_runs_backward_compat.py \
            tests/integrations/test_runs_router_contract.py

  docker-ci:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CI target
        run: docker build --target ci -t s18share-ci .

      - name: Run CI target
        run: docker run --rm s18share-ci

      - name: Build runtime image
        run: docker build --target runtime -t s18share-runtime .

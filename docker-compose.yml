services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: s18share-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      OPENAI_API_VERSION: ${OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AUTH_ENABLED: ${S18_AUTH_ENABLED:-false}
      S18_PROFILE: ${S18_PROFILE:-}
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://llama_cpp:8080}
      LLAMA_CPP_TIMEOUT: ${LLAMA_CPP_TIMEOUT:-360}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      S18_RUN_EXECUTOR: ${S18_RUN_EXECUTOR:-in_process}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      MCP_STDIO_CONNECT_TIMEOUT_SECONDS: ${MCP_STDIO_CONNECT_TIMEOUT_SECONDS:-120}
      S18_SESSION_SUMMARY_SYNC: ${S18_SESSION_SUMMARY_SYNC:-true}
      DEBUG_LOG_PATH: ${DEBUG_LOG_PATH:-/app/data/debug-f905fa.log}
    volumes:
      - ./data:/app/data
      - ./memory:/app/memory
      - ./config:/app/config
      - ./mcp_servers/faiss_index:/app/mcp_servers/faiss_index
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - default
      - shared_integration_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: s18share-worker
    restart: unless-stopped
    command: ["celery", "-A", "core.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AUTH_ENABLED: ${S18_AUTH_ENABLED:-false}
      S18_PROFILE: ${S18_PROFILE:-}
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://llama_cpp:8080}
      LLAMA_CPP_TIMEOUT: ${LLAMA_CPP_TIMEOUT:-360}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      S18_RUN_EXECUTOR: celery
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      MCP_STDIO_CONNECT_TIMEOUT_SECONDS: ${MCP_STDIO_CONNECT_TIMEOUT_SECONDS:-120}
      DEBUG_LOG_PATH: ${DEBUG_LOG_PATH:-/app/data/debug-f905fa.log}
    volumes:
      - ./data:/app/data
      - ./memory:/app/memory
      - ./config:/app/config
      - ./mcp_servers/faiss_index:/app/mcp_servers/faiss_index
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - default
      - shared_integration_net

  llama_cpp:
    profiles:
      - llama_cpp
    image: samueltallet/alpine-llama-cpp-server:latest
    container_name: s18share-llama-cpp
    restart: unless-stopped
    ports:
      - "8080:8080"
    command:
      - "/opt/llama.cpp/llama-server"
      - "-m"
      - "/models/${LLAMA_CPP_MODEL_FILE:-model.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--embeddings"
      - "--pooling"
      - "${LLAMA_CPP_POOLING:-mean}"
      - "--ctx-size"
      - "${LLAMA_CPP_CTX_SIZE:-4096}"
      - "--batch-size"
      - "${LLAMA_CPP_BATCH_SIZE:-512}"
      - "--ubatch-size"
      - "${LLAMA_CPP_UBATCH_SIZE:-512}"
      - "--n-predict"
      - "${LLAMA_CPP_N_PREDICT:-1024}"
    volumes:
      - ./models:/models
    networks:
      - default
      - shared_integration_net

  ollama:
    profiles:
      - ollama
    image: ollama/ollama:latest
    container_name: s18share-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - default
      - shared_integration_net

  redis:
    image: redis:7-alpine
    container_name: s18share-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - default

volumes:
  ollama_data:
  redis_data:

networks:
  shared_integration_net:
    external: true
    name: docker_default

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: s18share-api
  namespace: s18share
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: s18share-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

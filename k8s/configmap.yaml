apiVersion: v1
kind: ConfigMap
metadata:
  name: s18share-config
  namespace: s18share
data:
  AZURE_OPENAI_ENDPOINT: ""
  OPENAI_API_VERSION: "2024-10-21"
  AZURE_OPENAI_CHAT_DEPLOYMENT: ""
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ""
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_TIMEOUT: "300"
  S18_RUN_EXECUTOR: "in_process"
  MCP_MODE: "strict"
  MCP_REQUIRED_SERVERS: "rag,sandbox"
  MCP_STARTUP_TIMEOUT_SECONDS: "10"
  CELERY_BROKER_URL: "redis://s18share-redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://s18share-redis:6379/0"
  S18_CELERY_RUNS_QUEUE: "celery"
  S18_CELERY_INGEST_QUEUE: "ingest"
  S18_CELERY_PREFETCH_MULTIPLIER: "1"

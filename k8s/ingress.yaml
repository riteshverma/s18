apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s18share-api
  namespace: s18share
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: s18share.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s18share-api
                port:
                  number: 80

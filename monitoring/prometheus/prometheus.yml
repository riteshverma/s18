global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: s18-api
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8001

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

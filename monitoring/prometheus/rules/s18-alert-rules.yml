groups:
  - name: s18_alert_rules
    rules:
      - alert: S18ApiAvailabilityLow
        expr: s18:sli_api_availability:ratio_5m < 0.995
        for: 10m
        labels:
          severity: p1
        annotations:
          summary: API availability below 99.5%
          description: API availability is below SLO threshold.

      - alert: S18OrchestratorSuccessLow
        expr: s18:sli_agent_run_success:ratio_5m < 0.97
        for: 10m
        labels:
          severity: p1
        annotations:
          summary: Orchestrator success below 97%
          description: Orchestrator success ratio is below threshold.

      - alert: S18OrchestratorLatencyHigh
        expr: s18:orchestrator_run_latency_p95_ms:5m > 18000
        for: 15m
        labels:
          severity: p2
        annotations:
          summary: Orchestrator p95 latency above 18s
          description: Orchestrator latency exceeded SLO.

      - alert: S18RetrievalCoverageLow
        expr: s18:sli_retrieval_coverage:ratio_5m < 0.99
        for: 15m
        labels:
          severity: p2
        annotations:
          summary: Retrieval coverage below 99%
          description: Too many retrieval calls return empty results.

      - alert: S18McpReliabilityLow
        expr: s18:sli_mcp_reliability:ratio_5m < 0.98
        for: 15m
        labels:
          severity: p2
        annotations:
          summary: MCP reliability below 98%
          description: MCP tool success ratio is below threshold.

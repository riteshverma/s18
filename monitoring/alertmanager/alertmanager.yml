global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="p1"
      receiver: critical

receivers:
  - name: default
    webhook_configs:
      - url: http://host.docker.internal:5001/alerts
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: http://host.docker.internal:5001/alerts/critical
        send_resolved: true
